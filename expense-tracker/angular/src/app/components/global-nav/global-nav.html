<header class="fwe-fixed-header">
  <nav class="fwe-navbar fwe-navbar--no-logo">
    <div class="fwe-container">
      <div class="fwe-app-title-container">Expense Tracker</div>
      <div class="fwe-mobile-flyout fwe-d-block fwe-d-md-none fwe-mr-auto">
      </div>
      <nav class="fwe-navlist fwe-d-none fwe-d-md-flex">
      </nav>
    </div>
  </nav>

  <!-- Tab Navigation -->
  <div class="tab-nav-container">
    <div class="tab-nav">
      @for (tab of tabs; track tab.id) {
        <button
          type="button"
          class="tab-nav-item fwe-btn fwe-btn-link fwe-dark"
          [class.fwe-active]="activeToolbar === tab.id"
          (click)="selectTab(tab.id)">
          {{ tab.label }}
        </button>
      }
    </div>
    <div
      class="tab-nav-underline"
      [style.transform]="'translateX(' + (tabs.findIndex(t => t.id === activeToolbar) * 100) + '%)'"
      [style.width.%]="100 / tabs.length">
    </div>
  </div>
</header>
